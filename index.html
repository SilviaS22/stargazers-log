<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Starred repositories</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <p class="eyebrow">GitHub activity</p>
        <h1>Starred repositories</h1>
        <p class="intro">A small log of the repositories I’ve starred and want to revisit.</p>
      </header>
      <section aria-labelledby="repository-heading">
        <div class="section-heading">
          <h2 id="repository-heading">Repository log</h2>
          <span id="repository-count" class="count" aria-live="polite"></span>
        </div>
        <p id="status" class="status" role="status">Loading repositories...</p>
        <ul id="starred" class="repository-list"></ul>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
